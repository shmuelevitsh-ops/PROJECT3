# Region D, narrower extent: just the hallway approach + corridor gap, not
# the full room beyond it -- a distinct mission_bounds over the same real
# sub-region as mission_b, for variance within sim_2 itself.
mission_config:
  max_steps: 2000
  boundaries:
    x_boundary:
      min_cm: 170
      max_cm: 230
    y_boundary:
      min_cm: 190
      max_cm: 250
    height_boundary:
      min_cm: 210
      max_cm: 270
  gps_resolution_cm: 10
  output_mapping_resolution_factor: 1
