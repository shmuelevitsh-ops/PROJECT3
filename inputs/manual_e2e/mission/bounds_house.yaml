mission_config:
  # With offset (-40,+30,+120), local bounds are X[80,250), Y[120,280), Z[150,210).
  max_steps: 20000
  boundaries:
    x_boundary:
      min_cm: 120
      max_cm: 290
    y_boundary:
      min_cm: 90
      max_cm: 250
    height_boundary:
      min_cm: 30
      max_cm: 90
  gps_resolution_cm: 10
  output_mapping_resolution_factor: 1.0
