mission_config:
  # With offset (-20,+30,-10), local bounds are X[100,200), Y[90,200), Z[0,90).
  max_steps: 10000
  boundaries:
    x_boundary:
      min_cm: 120
      max_cm: 220
    y_boundary:
      min_cm: 60
      max_cm: 170
    height_boundary:
      min_cm: 10
      max_cm: 100
  gps_resolution_cm: 5
  output_mapping_resolution_factor: 1.0
